name: checks

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding or removing no-doc-change re-runs the doc map.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  docs:
    name: docs in step with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc-check diffs against the PR base

      - name: arc42 cross-section consistency
        run: python3 scripts/arc42-lint/arc42-lint.py docs/arc42 --strict --format github

      - name: doc map, RT ids, changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_DOC_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-doc-change') }}
        run: |
          args=()
          [ -n "$BASE" ] && args+=(--base "$BASE")
          [ "$NO_DOC_CHANGE" = "true" ] && args+=(--skip-doc-map)
          python3 scripts/doc-check.py "${args[@]}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: MCP server
        run: uv run --directory mcp pytest -q
      - name: hooks against a fake Mattermost
        run: uv run --directory mcp pytest -q ../tests/hooks

  opencode-plugin:
    name: OpenCode plugin (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Type stripping runs the .ts as is; the plugin imports only node: modules.
      - name: plugin glue against a fake hook API
        run: node --test opencode/test/plugin.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Warnings and errors only: info and style notes differ between
      # shellcheck versions, and the runner's is not the one on our machines.
      - name: shell scripts (shellcheck, .shellcheckrc)
        run: git ls-files -z '*.sh' '*.sh.example' | xargs -0 shellcheck -S warning
      - name: Python (ruff, ruff.toml)
        run: uvx ruff@0.17.2 check
      - name: MCP server types (mypy, mcp/pyproject.toml)
        run: uv run --directory mcp mypy
