[project]
name = "mattermost-ai-agent-bus"
version = "0.65.0"
description = "Mattermost AI agent bus MCP server (session + WebSocket inbox)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dembaca" }]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "websockets>=13.0",
]

[project.scripts]
mattermost-ai-agent-bus-mcp = "mattermost_ai_agent_bus.hosted:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

# The server (src) and the tests' port fake (tests/fakes.py); the other tests are
# not type-checked. strict covers disallow_untyped_defs, warn_return_any and
# warn_unused_ignores, among others.
[tool.mypy]
files = ["src", "tests/fakes.py"]
python_version = "3.11"
strict = true
